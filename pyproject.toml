[project]
name = "jev-triage"
version = "0.1.0"
description = "Jev-powered triage for deep-research agents: score N search results in one parallel call"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    # typesafe-sdk is optional: without it (or without TYPESAFE_API_KEY),
    # the client runs in mock mode so the pipeline and evals still work.
]

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
